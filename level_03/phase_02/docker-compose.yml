services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway1
      - gateway2

  # API Gateway 1
  gateway1:
    build: ./backend/gateway
    image: api-gateway:latest
    environment:
      - PORT=8000
      - GATEWAY_NAME=Gateway 1
    depends_on:
      - auth
      - products
      - orders
      - payments

  # API Gateway 2 (Reuses image for high availability)
  gateway2:
    image: api-gateway:latest
    depends_on:
      - gateway1
    environment:
      - PORT=8000
      - GATEWAY_NAME=Gateway 2

  # Microservice: Auth
  auth:
    build: ./backend/gateway/services/auth
    environment:
      - PORT=1000

  # Microservice: Products
  products:
    build: ./backend/gateway/services/products
    environment:
      - PORT=2000

  # Microservice: Orders
  orders:
    build: ./backend/gateway/services/orders
    environment:
      - PORT=3000

  # Microservice: Payments
  payments:
    build: ./backend/gateway/services/payments
    environment:
      - PORT=4000
